[project]
name = "complyos"
version = "0.1.0"
description = "L&D Compliance & Learning Operations MCP Server"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.21.0",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "uvicorn>=0.34.0",
    "pyyaml>=6.0.0",
    "aiosmtplib>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "types-PyYAML>=6.0.12",
]
postgres = [
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
complyos = "complyos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    'ignore:Using `httpx` with `starlette\.testclient` is deprecated; install `httpx2` instead\.',
    'ignore:SelectableGroups dict interface is deprecated\. Use select\.:DeprecationWarning:opentelemetry\.util\._importlib_metadata',
]

[tool.coverage.run]
source = ["complyos"]
branch = true

