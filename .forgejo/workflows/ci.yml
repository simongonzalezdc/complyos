on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: docker
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Debug info
        run: echo "CI started" && pwd && ls -la
      - name: Install Python
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq && apt-get install -y -qq python3 python3-pip
          fi
          python3 --version
          python3 -m pip --version
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then python3 -m pip install --break-system-packages -r requirements.txt; fi
          if [ -f pyproject.toml ]; then python3 -m pip install --break-system-packages -e ".[dev]"; fi
      - name: Lint
        run: |
          # Pinned to match uv.lock; unpinned installs drift to newer ruff
          # releases whose new rules (e.g. SIM222 changes) fail runs that
          # are green against the version the repo develops with.
          python3 -m pip install --break-system-packages ruff==0.15.16
          python3 -m ruff check .
      - name: Typecheck
        run: |
          echo "Typecheck started"
          python3 -m pip show mypy types-PyYAML
          timeout 120s python3 -m mypy complyos
          echo "Typecheck complete"
      - name: Test
        run: |
          if [ -f pytest.ini ] || [ -f setup.cfg ] || [ -d tests ]; then
            python3 -m pip install --break-system-packages pytest
            python3 -m pytest
          fi
